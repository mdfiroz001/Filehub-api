<style>  
    :root {  
        --primary: #4f46e5;  
        --primary-light: #e0e7ff;  
        --primary-glow: rgba(79, 70, 229, 0.35);  
        --secondary: #10b981;  
        --bg: #f8fafc;  
        --surface: #ffffff;  
        --text-main: #0f172a;  
        --text-sub: #64748b;  
        --border: #e2e8f0;  
        --red: #ef4444;  
        --green: #22c55e;  
        --yellow: #f59e0b;  
    }  
    [data-theme="dark"] {  
        --primary: #818cf8;  
        --primary-light: #1e293b;  
        --primary-glow: rgba(129, 140, 248, 0.35);  
        --secondary: #34d399;  
        --bg: #0f172a;  
        --surface: #1e293b;  
        --text-main: #f8fafc;  
        --text-sub: #94a3b8;  
        --border: #334155;  
        --red: #dc2626;  
        --green: #16a34a;  
        --yellow: #d97706;  
    }  
    body {   
        font-family: 'Inter', sans-serif;   
        background: var(--bg);   
        color: var(--text-main);   
        min-height: 100vh;   
        transition: all 0.3s ease;  
    }  
    .sidebar {  
        width: 280px;  
        background: var(--surface);  
        border-right: 1px solid var(--border);  
        padding: 20px;  
        position: fixed;  
        top: 0;  
        left: -280px;  
        height: 100vh;  
        z-index: 1000;  
        transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);  
        overflow-y: auto;  
        display: flex;  
        flex-direction: column;  
        box-shadow: 4px 0 24px rgba(0,0,0,0.02);  
    }  
    .sidebar.open { left: 0; }  
    @media (min-width: 768px) {  
        .sidebar { left: 0; }  
        .main-content { margin-left: 280px; }  
    }  
    .sidebar-overlay {  
        position: fixed;  
        top: 0; left: 0; width: 100%; height: 100%;  
        background: rgba(15, 23, 42, 0.6);  
        backdrop-filter: blur(4px);  
        z-index: 999;  
        display: none;  
    }  
    .sidebar-overlay.active { display: block; }  
    .sidebar-header {  
        display: flex;  
        align-items: center;  
        gap: 12px;  
        margin-bottom: 25px;  
        padding-bottom: 20px;  
        border-bottom: 1px solid var(--border);  
    }  
    .sidebar-logo {  
        width: 44px;  
        height: 44px;  
        border-radius: 12px;  
        object-fit: cover;  
        border: 2px solid var(--primary);  
        box-shadow: 0 4px 10px var(--primary-glow);  
    }  
    .sidebar-title {  
        font-family: 'Outfit', sans-serif;  
        font-size: 1.45rem;  
        font-weight: 800;  
        letter-spacing: -0.5px;  
    }  
    .nav-link {  
        display: flex;  
        align-items: center;  
        gap: 12px;  
        padding: 12px 16px;  
        border-radius: 10px;  
        color: var(--text-sub);  
        font-weight: 600;  
        font-size: 0.92rem;  
        transition: all 0.2s ease;  
        margin-bottom: 6px;  
        cursor: pointer;  
        text-decoration: none;  
    }  
    .nav-link:hover {   
        background: var(--primary-light);   
        color: var(--primary);  
        transform: translateX(3px);  
    }  
    .nav-link.active {   
        background: var(--primary);   
        color: white;   
        box-shadow: 0 4px 14px var(--primary-glow);  
    }  
    .nav-link i { font-size: 1.15rem; width: 22px; text-align: center; }  
      
    .main-content { flex-grow: 1; padding: 25px; }  
    .card {  
        background: var(--surface);   
        border-radius: 18px;  
        padding: 24px;   
        box-shadow: 0 4px 20px rgba(0,0,0,0.03);  
        border: 1px solid var(--border);  
        margin-bottom: 24px;  
    }  
    .card-title {  
        font-family: 'Outfit', sans-serif;  
        font-size: 1.25rem;   
        font-weight: 700;  
        margin-bottom: 16px;  
        display: flex;  
        align-items: center;  
        gap: 8px;  
    }  
      
    /* ড্যাশবোর্ড কার্ড স্টাইল */  
    .stat-card-pro {  
        background: var(--surface);  
        border: 1px solid var(--border);  
        border-radius: 18px;  
        padding: 20px;  
        display: flex;  
        align-items: center;  
        justify-content: space-between;  
        box-shadow: 0 4px 20px rgba(0,0,0,0.02);  
        position: relative;  
        overflow: hidden;  
        transition: transform 0.25s ease, box-shadow 0.25s ease;  
    }  
    .stat-card-pro:hover {  
        transform: translateY(-3px);  
        box-shadow: 0 8px 25px rgba(0,0,0,0.06);  
    }  
    .stat-card-pro::after {  
        content: '';  
        position: absolute;  
        left: 0;  
        bottom: 0;  
        width: 100%;  
        height: 4px;  
    }  
    .stat-blue::after { background: #4f46e5; }  
    .stat-emerald::after { background: #10b981; }  
    .stat-amber::after { background: #f59e0b; }  
    .stat-purple::after { background: #8b5cf6; }  

    .stat-icon-wrap {  
        width: 56px;  
        height: 56px;  
        border-radius: 14px;  
        display: flex;  
        align-items: center;  
        justify-content: center;  
        font-size: 1.6rem;  
    }  

    .btn {  
        padding: 9px 18px; border-radius: 10px;  
        font-weight: 600; cursor: pointer;  
        transition: 0.2s; border: none;  
        font-size: 0.9rem;  
        display: inline-flex; align-items: center; justify-content: center;  
        gap: 8px;  
    }  
    .btn-primary { background: var(--primary); color: white; }  
    .btn-primary:hover { opacity: 0.92; box-shadow: 0 4px 12px var(--primary-glow); }  
    .btn-danger { background: var(--red); color: white; }  
    .btn-danger:hover { opacity: 0.92; }  
    .btn-success { background: var(--green); color: white; }  
    .btn-success:hover { opacity: 0.92; }  
    .btn-warning { background: var(--yellow); color: white; }  
    .btn-warning:hover { opacity: 0.92; }  
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 8px; }  

    .form-group { margin-bottom: 18px; }  
    .form-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }  
    .form-input, .form-textarea, .form-select {   
        width: 100%; padding: 11px 14px;  
        border: 1.5px solid var(--border); border-radius: 10px;  
        background: var(--bg); color: var(--text-main);  
        box-sizing: border-box; font-size: 0.95rem;  
        transition: border-color 0.2s;  
    }  
    .form-input:focus, .form-textarea:focus, .form-select:focus {  
        outline: none; border-color: var(--primary);  
    }  
    .status-badge {  
        padding: 4px 12px; border-radius: 20px;  
        font-size: 0.75rem; font-weight: 700; text-transform: capitalize;  
        display: inline-flex; align-items: center; gap: 4px;  
    }  
    .status-active { background: #e0e7ff; color: #4f46e5; }  
    .status-inactive { background: #fee2e2; color: #dc2626; }  
    .status-approved { background: #dcfce7; color: #16a34a; }  
    .status-pending { background: #fef3c7; color: #d97706; }  
    .status-rejected { background: #fee2e2; color: #dc2626; }  
      
    .modal-overlay {  
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;  
        background: rgba(15, 23, 42, 0.65);  
        backdrop-filter: blur(5px);  
        z-index: 2000; display: none;  
        justify-content: center; align-items: center;  
    }  
    .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }  
    .modal-box {  
        background: var(--surface); width: 92%; max-width: 620px;  
        max-height: 90vh; overflow-y: auto;  
        border-radius: 18px; padding: 26px;  
        position: relative;  
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);  
        border: 1px solid var(--border);  
    }  
    .modal-close {  
        position: absolute; top: 18px; right: 18px;  
        cursor: pointer; font-size: 1.3rem;  
        color: var(--text-sub); transition: 0.2s;  
    }  
    .modal-close:hover { color: var(--red); }  
    .alert { padding: 14px; border-radius: 10px; margin-bottom: 18px; font-weight: 500; font-size: 0.92rem; }  
    .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }  
    .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }  
    .hidden { display: none !important; }  

    .data-table { width: 100%; border-collapse: separate; border-spacing: 0; white-space: nowrap; }  
    .data-table th { text-align: left; padding: 14px; background: var(--bg); color: var(--text-sub); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }  
    .data-table td { padding: 14px; border-bottom: 1px solid var(--border); font-size: 0.92rem; }  
    .data-table tr:hover td { background: var(--bg); }  
      
    .info-badge {  
        background: rgba(79, 70, 229, 0.08); color: var(--primary);  
        padding: 10px 16px; border-radius: 10px;  
        font-size: 0.88rem; font-weight: 600;  
        display: inline-flex; align-items: center; gap: 8px;  
        margin-bottom: 20px; width: 100%;  
        border-left: 4px solid var(--primary);  
    }  

    .slug-preview {  
        background: var(--bg);  
        border: 1px solid var(--border);  
        border-radius: 8px;  
        padding: 10px 14px;  
        font-family: monospace;  
        font-size: 0.85rem;  
        color: var(--primary);  
        word-break: break-all;  
        margin-top: 6px;  
    }  
    .slug-input-wrapper {  
        display: flex; align-items: center; gap: 6px;  
        background: var(--bg);  
        border: 1.5px solid var(--border);  
        border-radius: 10px;  
        padding: 0 12px;  
    }  
    .slug-input-wrapper:focus-within { border-color: var(--primary); }  
    .slug-input-wrapper .prefix {  
        color: var(--text-sub); font-size: 0.88rem;  
        white-space: nowrap; font-family: monospace;  
    }  
    .slug-input-wrapper input {  
        border: none; background: transparent;  
        padding: 11px 0; outline: none;  
        width: 100%; color: var(--text-main);  
        font-family: monospace; font-size: 0.9rem;  
    }  

    .prompt-thumb {  
        width: 60px; height: 60px;  
        object-fit: cover; border-radius: 10px;  
        border: 1px solid var(--border);  
    }  
    .step-badge {  
        background: var(--primary-light);  
        color: var(--primary);  
        padding: 4px 10px;  
        border-radius: 20px;  
        font-size: 0.75rem;  
        font-weight: 700;  
        display: inline-flex;  
        align-items: center; gap: 4px;  
    }  
    .step-badge.step-zero { background: #dcfce7; color: #16a34a; }  

    .social-input-row {  
        display: flex; align-items: center; gap: 10px;  
        background: var(--bg); border: 1.5px solid var(--border);  
        border-radius: 10px; padding: 0 12px;  
        margin-bottom: 12px;  
    }  
    .social-input-row .icon-box {  
        width: 32px; height: 32px;  
        border-radius: 50%;  
        display: flex; align-items: center; justify-content: center;  
        color: white; font-size: 0.9rem; flex-shrink: 0;  
    }  
    .social-input-row .icon-box.telegram { background: #0088cc; }  
    .social-input-row .icon-box.facebook { background: #1877f2; }  
    .social-input-row .icon-box.youtube { background: #ff0000; }  
    .social-input-row .icon-box.whatsapp { background: #25d366; }  
    .social-input-row .icon-box.instagram { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }  
    .social-input-row .icon-box.twitter { background: #000000; }  
    .social-input-row .icon-box.email { background: #ea4335; }  
    .social-input-row input {  
        flex: 1; border: none; background: transparent;  
        padding: 12px 0; outline: none; color: var(--text-main);  
        font-size: 0.9rem;  
    }  

    @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }  
    ::-webkit-scrollbar { width: 6px; height: 6px; }  
    ::-webkit-scrollbar-track { background: var(--bg); }  
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }  
</style>

</head>

    const DEFAULT_LOGO = "https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png";  
  
    // লোগো ডাইনামিক আপডেট মেথড  
    function updateAdminBranding(logoUrl, name) {  
        const targetLogo = logoUrl && logoUrl.trim() !== '' ? logoUrl : DEFAULT_LOGO;  
        const brandName = name && name.trim() !== '' ? name : 'FileHub';  
          
        const loginImg = document.getElementById('login-logo-img');  
        if (loginImg) loginImg.src = targetLogo;

    function esc(str) {  
        if (!str) return '';  
        return String(str)  
            .replace(/&/g, '&amp;')  
            .replace(/</g, '&lt;')  
            .replace(/>/g, '&gt;')  
            .replace(/"/g, '&quot;')  
            .replace(/'/g, '&#039;');  
    }  
  
    // ==================== SLUG SYSTEM ====================  
    function generateSlugFromTitle(title) {  
        if (!title) return '';  
        return title.toLowerCase().trim()  
            .replace(/[\u0980-\u09FF]/g, '')  
            .replace(/[^a-z0-9\s-]/g, '')  
            .replace(/\s+/g, '-')  
            .replace(/-+/g, '-')  
            .replace(/^-+|-+$/g, '')  
            .substring(0, 60);  
    }  
    window.autoGenerateSlug = function() {  
        const titleInput = document.getElementById('file-title');  
        const slugInput = document.getElementById('file-slug');  
        if (!titleInput || !slugInput) return;  
        if (slugInput.dataset.userEdited === 'true') return;  
        slugInput.value = generateSlugFromTitle(titleInput.value);  
        updateSlugPreview();  
    };  
    window.sanitizeSlugInput = function() {  
        const slugInput = document.getElementById('file-slug');  
        if (!slugInput) return;  
        const cleaned = slugInput.value.toLowerCase()  
            .replace(/[\u0980-\u09FF]/g, '')  
            .replace(/[^a-z0-9\s-]/g, '')  
            .replace(/\s+/g, '-')  
            .replace(/-+/g, '-');  
        slugInput.value = cleaned;  
        slugInput.dataset.userEdited = 'true';  
        updateSlugPreview();  
    };  
    window.updateSlugPreview = function() {  
        const slugInput = document.getElementById('file-slug');  
        const previewEl = document.getElementById('slug-preview');  
        if (!slugInput || !previewEl) return;  
        const slug = slugInput.value.trim() || 'auto-generated';  
        previewEl.textContent = window.location.origin + '/file/' + slug;  
    };  
    async function getUniqueSlug(baseSlug, excludeFileId) {  
        let slug = baseSlug;  
        let counter = 1;  
        while (counter <= 20) {  
            const snapshot = await filesRef.child(slug).once('value');  
            if (!snapshot.exists() || snapshot.key === excludeFileId) return slug;  
            counter++;  
            slug = baseSlug + '-' + counter;  
        }  
        return baseSlug + '-' + Date.now().toString().slice(-5);  
    }

    window.openHtmlTemplateForm=async function(id){

async function savePrompt(e, index) {  
    e.preventDefault();  
    const btn = document.getElementById('save-prompt-btn');  
    btn.disabled = true;  
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving...';  

    const title = document.getElementById('prompt-title').value.trim();  
    const promptText = document.getElementById('prompt-text').value.trim();  
    const requiredAds = parseInt(document.getElementById('prompt-required-ads').value) || 0;  
    const sampleImage = document.getElementById('prompt-sample-image').value.trim();  
    const detailPhotosText = document.getElementById('prompt-detail-photos').value.trim();  
    const detailPhotos = detailPhotosText.split('\n').map(function(u) { return u.trim(); }).filter(function(u) { return u; });  

    if (!title || !promptText) {  
        showAlert('modal-alert', 'Fill required fields', 'error');  
        btn.disabled = false;  
        btn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Prompt';  
        return;  
    }  

    try {  
        const imgSettings = appSettings.aiImage || {};  
        let prompts = (imgSettings.prompts || []).slice();  
        const isEdit = (index !== null && index !== undefined);  
        const newPrompt = {  
            title: title,  
            prompt: promptText,  
            required_ads: requiredAds,  
            sample_image: sampleImage,  
            detail_photos: detailPhotos,  
            created_at: (isEdit && prompts[index]) ? (prompts[index].created_at || Date.now()) : Date.now()  
        };  
        if (isEdit) prompts[index] = newPrompt;  
        else prompts.push(newPrompt);  

        await settingsRef.child('aiImage').child('prompts').set(prompts);  
        showAlert('modal-alert', '✅ Prompt saved!', 'success');  
        setTimeout(function() { closeModal(); loadData(); }, 800);  
    } catch (error) {  
        showAlert('modal-alert', error.message, 'error');  
        btn.disabled = false;  
        btn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Prompt';  
    }  
}  

window.copyPromptAdmin = function(index) {  
    const imgSettings = appSettings.aiImage || {};  
    const prompts = imgSettings.prompts || [];  
    if (!prompts[index]) return;  
    navigator.clipboard.writeText(prompts[index].prompt).then(function() {  
        alert('✅ Prompt copied!');  
    }).catch(function() {  
        const temp = document.createElement('textarea');  
        temp.value = prompts[index].prompt;  
        document.body.appendChild(temp);  
        temp.select();  
        document.execCommand('copy');  
        document.body.removeChild(temp);  
        alert('✅ Copied!');  
    });  
};  

window.deletePrompt = function(index) {  
    openConfirmModal('Delete this prompt permanently?', async function() {  
        const imgSettings = appSettings.aiImage || {};  
        let prompts = (imgSettings.prompts || []).slice();  
        prompts.splice(index, 1);  
        await settingsRef.child('aiImage').child('prompts').set(prompts);  
        await loadData();  
    });  
};

function renderUsers() {  
    document.getElementById('page-content').innerHTML =   
        '<h1 class="text-3xl font-bold font-[\'Outfit\'] mb-6">Users Management</h1>' +  
        '<div class="card"><div class="mb-4"><input type="text" id="user-search" class="form-input" placeholder="Search by name, username, email or ID..."></div>' +

        '<tbody id="users-table">' + generateUsersTableHTML(allUsers) + '</tbody></table></div></div>';  

    const searchInput = document.getElementById('user-search');  
    if (searchInput) {  
        searchInput.addEventListener('input', function(e) {  
            const s = e.target.value.toLowerCase();  
            const filtered = allUsers.filter(function(u) {  
                return (u.email && u.email.toLowerCase().indexOf(s) !== -1) ||  
                       (u.username && u.username.toLowerCase().indexOf(s) !== -1) ||  
                       (u.numericId && u.numericId.indexOf(s) !== -1) ||  
                       (u.fullname && u.fullname.toLowerCase().indexOf(s) !== -1);  
            });  
            document.getElementById('users-table').innerHTML = generateUsersTableHTML(filtered);  
        });

function generateUsersTableHTML(users) {  
    if (users.length === 0) return '<tr><td colspan="5" class="text-center text-gray-500 py-8">No users found</td></tr>';  
    let html = '';  
    users.forEach(function(user) {  
        html += '<tr>' +  
            '<td class="font-mono text-sm">' + (user.numericId || user.id.substring(0,10)) + '</td>' +  
            '<td class="font-medium">' + esc(user.username || 'N/A') + '</td>' +  
            '<td>' + esc(user.email || 'N/A') + '</td>' +  
            '<td><span class="status-badge ' + (user.isAccountActive !== false ? 'status-active' : 'status-inactive') + '">' + (user.isAccountActive !== false ? 'Active' : 'Banned') + '</span></td>' +  
            '<td class="flex gap-1">' +  
                '<button class="btn ' + (user.isAccountActive !== false ? 'btn-danger' : 'btn-success') + ' btn-sm" onclick="toggleUserBan(\'' + user.id + '\', ' + (user.isAccountActive !== false) + ')"><i class="fas ' + (user.isAccountActive !== false ? 'fa-ban' : 'fa-check') + '"></i></button>' +  
                '<button class="btn btn-warning btn-sm" onclick="editUser(\'' + user.id + '\')"><i class="fas fa-edit"></i></button>' +  
            '</td></tr>';  
    });  
    return html;  
}  

async function toggleUserBan(userId, currentStatus) {  
    openConfirmModal('Are you sure you want to ' + (currentStatus ? 'BAN' : 'UNBAN') + ' this user?', async function() {  
        await usersRef.child(userId).update({ isAccountActive: !currentStatus });

}

async function loadRecentNotifications() {  
    try {  
        const snap = await notificationsRef.orderByChild('created_at').limitToLast(20).once('value');  
        const notifications = snap.val() ? Object.entries(snap.val()).map(function(e) { return Object.assign({ id: e[0] }, e[1]); }).sort(function(a, b) { return (b.created_at || 0) - (a.created_at || 0); }) : [];  
        const list = document.getElementById('notifications-list');  
        if (!list) return;  
        if (notifications.length === 0) {  
            list.innerHTML = '<tr><td colspan="4" class="text-center text-gray-500 py-4">No notifications sent yet</td></tr>';  
            return;  
        }  
        let html = '';  
        notifications.forEach(function(n) {  
            html += '<tr>' +  
                '<td class="max-w-[200px] truncate font-medium">' + esc(n.title || 'Untitled') + '</td>' +  
                '<td>' + (n.target_uid === 'all' || !n.target_uid ? '<span class="status-badge status-active">All Users</span>' : '<span class="status-badge status-pending">' + n.target_uid.substring(0,8) + '...</span>') + '</td>' +  
                '<td>' + (n.created_at ? new Date(n.created_at).toLocaleDateString() : 'N/A') + '</td>' +  
                '<td><button class="btn btn-danger btn-sm" onclick="deleteNotification(\'' + n.id + '\')"><i class="fas fa-trash"></i></button></td>' +  
                '</tr>';  
        });  
        list.innerHTML = html;  
    } catch (error) {  
        console.error(error);  
        const list = document.getElementById('notifications-list');  
        if (list) list.innerHTML = '<tr><td colspan="4" class="text-center text-red-500 py-4">Error loading data</td></tr>';  
    }  
}  

function deleteNotification(id) {  
    openConfirmModal('Delete this notification permanently?', async function() {  
        await notificationsRef.child(id).remove();  
        loadRecentNotifications();  
    });  
}  

async function sendNotification(e) {  
    e.preventDefault();  
    const sendBtn = document.getElementById('send-notif-btn');  
    sendBtn.disabled = true;  
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Sending...';  
    const targetUid = document.getElementById('notif-target').value.trim();  
    try {  
        await notificationsRef.push({  
            title: document.getElementById('notif-title').value,  
            decs: document.getElementById('notif-message').value,  
            created_at: Date.now(),  
            is_read: false,  
            target_uid: targetUid || 'all'  
        });  
        showAlert('notif-alert', 'Notification sent successfully!', 'success');  
        document.getElementById('notification-form').reset();  
        loadRecentNotifications();  
    } catch (error) { showAlert('notif-alert', error.message, 'error'); }  
    sendBtn.disabled = false;  
    sendBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Send Notification';  
}

function previewWelcomeImage() {  
    const input = document.getElementById('welcome-image');  
    const wrap = document.getElementById('welcome-image-preview-wrap');  
    const image = document.getElementById('welcome-image-preview');  
    if (!input || !wrap || !image) return;  
    const url = input.value.trim();  
    if (!url) {  
        wrap.classList.add('hidden');  
        image.removeAttribute('src');  
        return;  
    }  
    image.onload = function() { wrap.classList.remove('hidden'); };  
    image.onerror = function() { wrap.classList.add('hidden'); };  
    image.src = url;  
}

        '<select id="file-status" class="form-select">' +  
            '<option value="approved" ' + (file.status === 'approved' || !fileId ? 'selected' : '') + '>Approved (Public)</option>' +  
            '<option value="pending" ' + (file.status === 'pending' ? 'selected' : '') + '>Pending Review</option>' +  
            '<option value="rejected" ' + (file.status === 'rejected' ? 'selected' : '') + '>Rejected</option>' +  
        '</select></div>' +  
        '<div class="flex justify-end gap-3 mt-4">' +  
            '<button type="button" class="btn btn-danger" onclick="closeModal()">Cancel</button>' +  
            '<button type="submit" class="btn btn-success" id="save-file-btn"><i class="fas fa-save mr-2"></i> Save File</button>' +  
        '</div>';  

    setTimeout(function() {  
        if (existingSlug) {  
            const slugInput = document.getElementById('file-slug');  
            if (slugInput) slugInput.dataset.userEdited = 'true';  
        }  
        updateSlugPreview();  
    }, 50);  

    document.getElementById('modal-form').onsubmit = function(e) { saveFile(e, fileId); };  
    openModal();  
}  

async function saveFile(e, fileId) {  
    e.preventDefault();  
    const saveBtn = document.getElementById('save-file-btn');  
    saveBtn.disabled = true;  
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving...';  

    const existingFile = fileId ? allFiles.find(function(f) { return f.id === fileId; }) : {};  
    const title = document.getElementById('file-title').value.trim();  
    const customSlug = document.getElementById('file-slug').value.trim();  

    let baseSlug = customSlug || generateSlugFromTitle(title);  
    if (!baseSlug) baseSlug = 'file-' + Date.now().toString().slice(-8);  

    let finalSlug = baseSlug;  
    if (!fileId || (existingFile.id && existingFile.id !== baseSlug)) {  
        finalSlug = await getUniqueSlug(baseSlug, fileId);  
    }  

    const detailPhotosText = document.getElementById('file-detail-photos').value.trim();  
    const detailPhotos = detailPhotosText.split('\n').map(function(u) { return u.trim(); }).filter(function(u) { return u; });  

    const fileData = {  
        title: title,  
        description: document.getElementById('file-description').value,  
        thumbnail_url: document.getElementById('file-thumbnail').value,  
        download_url: document.getElementById('file-download-url').value,  
        file_extension: document.getElementById('file-extension').value,  
        required_ads: parseInt(document.getElementById('file-required-ads').value) || 0,  
        detail_photos: detailPhotos,  
        status: document.getElementById('file-status').value,  
        created_at: existingFile.created_at || Date.now(),  
        total_downloads: existingFile.total_downloads || 0,  
        uploadedBy: existingFile.uploadedBy || currentUser.uid,  
        uploadedByEmail: existingFile.uploadedByEmail || currentUser.email  
    };  

    try {  
        if (fileId) {  
            if (existingFile.id !== finalSlug) {  
                await filesRef.child(finalSlug).set(fileData);  
                await filesRef.child(existingFile.id).remove();  
            } else {  
                await filesRef.child(fileId).update(fileData);  
            }  
        } else {  
            await filesRef.child(finalSlug).set(fileData);  
        }  
        showAlert('modal-alert', '✅ File saved! URL: /file/' + finalSlug, 'success');  
        setTimeout(function() { closeModal(); loadData(); }, 1500);  
    } catch (error) {  
        showAlert('modal-alert', error.message, 'error');  
        saveBtn.disabled = false;  
        saveBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Save File';  
    }  
}  

function editFile(fileId) { openFileForm(fileId); }  
function deleteFile(fileId, title) {  
    openConfirmModal('Delete file "' + title + '" permanently?', async function() {  
        await filesRef.child(fileId).remove();  
        await loadData();  
    });  
}

    const banner = bannerId ? allBanners.find(function(b) { return b.id === bannerId; }) : {};

    document.getElementById('modal-form').innerHTML =   
        '<div class="form-group"><label class="form-label">Title <span style="color:var(--red);">*</span></label>' +  
        '<input type="text" id="banner-title" class="form-input" value="' + esc(banner.title || '') + '" required></div>' +  
        '<div class="form-group"><label class="form-label">Image URL <span style="color:var(--red);">*</span></label>' +  
        '<input type="url" id="banner-thumbnail" class="form-input" value="' + esc(banner.thumbnail_url || '') + '" oninput="previewBannerImage()" required>' +  
        '<div id="banner-image-preview" style="margin-top:10px;">' + previewImg + '</div>' +  
        '<p style="font-size:0.75rem;color:var(--text-sub);margin-top:5px;">💡 1200×630 px recommended</p></div>' +  
        '<div class="form-group"><label class="form-label">Target Link (Optional)</label>' +  
        '<input type="url" id="banner-download-url" class="form-input" value="' + esc(banner.download_url || '') + '" placeholder="https://example.com/page"></div>' +  
        '<div class="flex justify-end gap-3 mt-4">' +  
            '<button type="button" class="btn btn-danger" onclick="closeModal()">Cancel</button>' +  
            '<button type="submit" class="btn btn-success" id="save-banner-btn"><i class="fas fa-save mr-2"></i> Save Banner</button>' +  
        '</div>';  

    document.getElementById('modal-form').onsubmit = function(e) { saveBanner(e, bannerId); };  
    openModal();  
}  

window.previewBannerImage = function() {  
    const url = document.getElementById('banner-thumbnail').value.trim();  
    const preview = document.getElementById('banner-image-preview');  
    if (!url) { preview.innerHTML = ''; return; }  
    preview.innerHTML = '<img src="' + esc(url) + '" style="max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--border);" onerror="this.style.display=\'none\'">';  
};  

async function saveBanner(e, bannerId) {  
    e.preventDefault();  
    const saveBtn = document.getElementById('save-banner-btn');  
    saveBtn.disabled = true;  
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving...';  

    const existingBanner = bannerId ? allBanners.find(function(b) { return b.id === bannerId; }) : {};  
    const bannerData = {  
        title: document.getElementById('banner-title').value,  
        thumbnail_url: document.getElementById('banner-thumbnail').value,  
        download_url: document.getElementById('banner-download-url').value,  
        created_at: existingBanner.created_at || Date.now()  
    };  
    try {  
        if (bannerId) await bannersRef.child(bannerId).update(bannerData);  
        else await bannersRef.push(bannerData);  
        showAlert('modal-alert', '✅ Banner saved!', 'success');  
        setTimeout(function() { closeModal(); loadData(); }, 1000);  
    } catch (error) {  
        showAlert('modal-alert', error.message, 'error');  
        saveBtn.disabled = false;  
        saveBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Banner';  
    }  
}  

function editBanner(bannerId) { openBannerForm(bannerId); }  
function deleteBanner(bannerId, title) {  
    openConfirmModal('Delete slider "' + title + '"?', async function() {  
        await bannersRef.child(bannerId).remove();  
        await loadData();  
    });  
}

function editUser(userId) {  
    const user = allUsers.find(function(u) { return u.id === userId; });  
    if (!user) return;  
    document.getElementById('modal-title').textContent = 'Edit User';  

    document.getElementById('modal-form').innerHTML =   
        '<div class="form-group"><label class="form-label">User ID</label><input type="text" class="form-input" value="' + esc(user.numericId || user.id) + '" disabled></div>' +  
        '<div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" value="' + esc(user.email || '') + '" disabled></div>' +  
        '<div class="form-group"><label class="form-label">Username</label><input type="text" id="user-username" class="form-input" value="' + esc(user.username || '') + '" required></div>' +  
        '<div class="form-group"><label class="form-label">Full Name</label><input type="text" id="user-fullname" class="form-input" value="' + esc(user.fullname || '') + '" required></div>' +  
        '<div class="flex justify-end gap-3 mt-4">' +  
            '<button type="button" class="btn btn-danger" onclick="closeModal()">Cancel</button>' +  
            '<button type="submit" class="btn btn-success">Save</button>' +  
        '</div>';  

    document.getElementById('modal-form').onsubmit = async function(e) {  
        e.preventDefault();  
        try {  
            await usersRef.child(userId).update({  
                username: document.getElementById('user-username').value,  
                fullname: document.getElementById('user-fullname').value  
            });  
            closeModal();  
            await loadData();  
        } catch (err) { showAlert('modal-alert', err.message, 'error'); }  
    };  
    openModal();  
}
